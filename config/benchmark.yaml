# Central configuration for the Local Index vs Shared Index benchmark scaffold.
# Every script under scripts/ reads this file — keep it as the single source of
# truth for the seed, dataset locations, and split/query-set sizes so both
# architectures consume byte-identical inputs.

seed: 42

datasets:
  products:
    handle: "asaniczka/amazon-products-dataset-2023-1-4m-products"
    file: "amazon_products.csv"
    categories_file: "amazon_categories.csv"
  queries:
    handle: "abhishekmungoli/amazon-query-product-search"
    preferred_locale: "us"

paths:
  data_dir: "data"
  reports_dir: "data/reports"

split:
  offline_fraction: 0.8 # ~80% initial corpus, ~20% held-out write corpus

query_set:
  fixed_size: 5000

workload:
  index_batch_size: 500
  write_feed_batch_size: 50
  smoke_test_query_count: 1000
  smoke_test_sample_inspect_count: 20

# Both systems are OpenSearch (see infra/l1, infra/s1 and README "Search
# infrastructure"), pinned to the same OPENSEARCH_VERSION (infra/.env). Bring
# up the relevant compose stack, then fill in write_base_url/search_base_url
# below — until then scripts/smoke_test.py, scripts/index_initial_corpus.py,
# scripts/feed_write_workload.py, and scripts/opensearch/create_index.py exit
# early with an explicit blocker message instead of silently doing nothing.
#
# local_index (L1): both nodes do indexing and search, so write_base_url and
# search_base_url are the same cluster (any node's published port works).
# shared_index (S1): write_base_url must point at the data node (os-s1-data,
# port 9202) and search_base_url at the dedicated search node (os-s1-search,
# port 9203) — this mirrors the architecture's node-role split at the client
# level rather than relying solely on server-side strict routing.
systems:
  local_index:
    write_base_url: "http://localhost:9200"
    search_base_url: "http://localhost:9200"
    index_name: "products"
  shared_index:
    write_base_url: "http://localhost:9202" # os-s1-data
    search_base_url: "http://localhost:9203" # os-s1-search
    index_name: "products"
